# Stack de PRODUCTION Baraka — Raspberry Pi 4/5 (8 Go, ARM64).
# Ingress : Cloudflare Tunnel → Caddy → services. Admin via Tailscale (hors compose).
# Images cross-buildées linux/arm64 en CI et poussées sur GHCR.
#
#   docker compose --env-file .env up -d
#
# Budget mémoire (limites) ≈ 3,4 Go → confortable sur 8 Go.

x-restart: &restart
  restart: unless-stopped

services:
  db:
    # Seule image PostGIS fiable en arm64.
    image: imresamu/postgis:16-3.4
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ['postgres', '-c', 'config_file=/etc/postgresql/postgresql.conf']
    mem_limit: 1500m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Jamais exposé à l'extérieur — accessible seulement via le réseau compose.

  api:
    image: ${REGISTRY:-ghcr.io/baraka}/baraka-api:${TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    <<: *restart
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      API_PORT: '3001'
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PAYMENT_PROVIDERS: ${PAYMENT_PROVIDERS:-cash}
      KONNECT_API_URL: ${KONNECT_API_URL:-}
      KONNECT_API_KEY: ${KONNECT_API_KEY:-}
      KONNECT_WALLET_ID: ${KONNECT_WALLET_ID:-}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./data/uploads:/app/data/uploads
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:3001/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    image: ${REGISTRY:-ghcr.io/baraka}/baraka-api:${TAG:-latest}
    <<: *restart
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${REGISTRY:-ghcr.io/baraka}/baraka-web:${TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    <<: *restart
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      PORT: '3000'
    mem_limit: 512m
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    <<: *restart
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on:
      - api
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    <<: *restart
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    mem_limit: 64m
    depends_on:
      - caddy

  uptime-kuma:
    image: louislam/uptime-kuma:1
    <<: *restart
    volumes:
      - ./data/kuma:/app/data
    mem_limit: 256m
    # Exposé uniquement au réseau Tailscale de l'hôte (jamais au tunnel public).
    ports:
      - '127.0.0.1:3011:3001'

volumes:
  caddy_data:
  caddy_config:
