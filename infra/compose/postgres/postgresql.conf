# Tuning PostgreSQL/PostGIS pour Raspberry Pi 8 Go (mono-instance, SSD).
listen_addresses = '*'
max_connections = 50

# Mémoire (db limité à ~1,5 Go par compose).
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 16MB
maintenance_work_mem = 128MB

# Durabilité : le Pi doit avoir un onduleur (UPS). On garde fsync ON.
fsync = on
synchronous_commit = on
wal_compression = on

# SSD : coût d'accès aléatoire faible.
random_page_cost = 1.1
effective_io_concurrency = 200

# Checkpoints étalés (moins d'usure disque).
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 128MB

# Logs légers.
log_min_duration_statement = 500
log_line_prefix = '%t [%p] %u@%d '
timezone = 'Africa/Tunis'
